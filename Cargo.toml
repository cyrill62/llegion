[package]
name = "ollama-egui"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Cross-platform desktop control panel for Ollama"
repository = "https://github.com/cyrill62/ollama-egui"
readme = "README.md"
keywords = ["ollama", "llm", "egui", "gui"]
categories = ["gui"]

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
directories = "6.0.0"
eframe = "0.37.0"
egui_material_icons = "0.9.0"
egui_plot = "0.38.0"
getrandom = "0.4.3"
# Debug-only screenshot capture; already in the tree through eframe's image loading.
png = "0.18.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.39.6"
toml = "1.1.8"
ureq = { version = "3.5.0", default-features = false, features = ["json", "gzip"] }

[profile.release]
strip = true
lto = "thin"

[features]
default = ["rustls"]
# TLS backend for talking to an HTTPS proxy / remote server.
rustls = ["ureq/rustls"]
