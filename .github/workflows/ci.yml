name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Linux GUI dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - name: TUI only (no GUI dependencies)
        run: cargo clippy --all-targets --no-default-features --features tui,rustls,sqlite -- -D warnings
      - run: cargo test --all-features
      - name: GPU detection on this OS
        run: cargo test detect_and_sample -- --nocapture

  e2e:
    name: end-to-end (managed server + Ferron)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev
      - name: Install Ferron
        run: |
          curl -sSL -o ferron.zip https://github.com/ferronweb/ferron/releases/download/2.8.1/ferron-2.8.1-x86_64-unknown-linux-gnu.zip
          mkdir -p "$HOME/bin" && unzip -o ferron.zip ferron -d "$HOME/bin" && chmod +x "$HOME/bin/ferron"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: cargo test e2e -- --ignored
